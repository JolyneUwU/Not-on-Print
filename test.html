<!DOCTYPE html>
<html>

<body>
    <h1>JavaScript Statements</h1>

    <p>A <b>JavaScript program</b> is a list of <b>statements</b> to be executed by a computer.</p>


    <button type="button" onclick="changeLanguage(); checkLanguage()">Click Me!</button>

    <p id="ger" style="display:none">Hallo</p>
    <p id="eng" style="display:block">Hello</p>



    <script>




        var lang;
        lang = 'eng'
        checkLanguage()

        function changeLanguage() {
            if (lang == 'eng') {
                lang = 'ger'
            }
            else if (lang == 'ger') {
                lang = 'eng'
            }
        }

        function checkLanguage() {
            if (lang == 'eng') {
                document.getElementById('eng').style.display = 'block'
                document.getElementById('ger').style.display = 'none'
            }

            else if (lang == 'ger') {
                document.getElementById('ger').style.display = 'block'
                document.getElementById('eng').style.display = 'none'
            }
        }



    </script>

</body>

</html>
